<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Testes · CriptoOps</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    body { padding: 24px 16px 48px; }
    main { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }
    h1 { font-size: var(--fs-h1); line-height: var(--lh-h1); }
    .resumo { color: var(--text-muted); }
    .resumo b { color: var(--text); }
    .grupo { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; }
    .grupo h2 { font-size: var(--fs-h2); line-height: var(--lh-h2); margin-bottom: 8px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
    li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; }
    .ok::before { content: "✓"; color: var(--up); }
    .falha::before { content: "✗"; color: var(--down); }
    .det { color: var(--text-muted); font-family: var(--font-mono); font-size: 12px; grid-column: 2; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Testes do CriptoOps</h1>
      <p class="resumo" id="resumo">Rodando…</p>
    </header>
    <div id="saida"></div>
  </main>

  <script type="module">
    import { MOEDAS_ATIVAS } from '../assets/js/data/coins.js';
    import { historicoSimulado } from '../assets/js/market/history.js';
    import { gerarDados } from '../assets/js/data/seed.js';
    import { validarDados } from '../assets/js/data/validate.js';
    import { relatorio } from '../assets/js/calc/reports.js';
    import { resumoBanca } from '../assets/js/calc/bank.js';
    import { posicoesAbertas } from '../assets/js/calc/positions.js';
    import { periodoDaData, fimDoPeriodo, datasDosPeriodos, calcularComissao } from '../assets/js/calc/commission.js';
    import { evolucaoPatrimonio } from '../assets/js/calc/equity.js';
    import { criarRandom } from '../assets/js/utils/random.js';
    import { diaISO } from '../assets/js/utils/dates.js';
    import { lerMiniTicker, urlDoFluxo, criarFluxo } from '../assets/js/market/binance.js';
    import { criarMontador, MAX_VELAS } from '../assets/js/market/candles.js';
    import { criarSimuladorAoVivo } from '../assets/js/market/simulated.js';
    import { sparkline, pontosDaSerie } from '../assets/js/ui/sparkline.js';
    import { relatorioCSV } from '../assets/js/calc/reports.js';
    import { posicoesAbertasEm } from '../assets/js/calc/positions.js';
    import { apurar } from '../assets/js/calc/commission.js';
    import { numeroCSV } from '../assets/js/utils/csv.js';
    import { data, intervalo } from '../assets/js/utils/format.js';
    import { intervaloDoPreset, lerFiltros, consultaDosFiltros } from '../assets/js/ui/filters.js';
    import { textoConsulta } from '../assets/js/router.js';
    import { fatiasDaBanca } from '../assets/js/ui/bankbar.js';
    import { progressoAteAlvo } from '../assets/js/views/client/posicoes.js';
    import { proximoPeriodo } from '../assets/js/views/client/comissoes.js';
    import { carregarDados, getState, periodoAberto, definirDiaFechamento, apurarPeriodo } from '../assets/js/store.js';
    import * as loja from '../assets/js/store.js';
    import { verificarCompra } from '../assets/js/engine/checks.js';
    import { criarConfirmacao } from '../assets/js/engine/confirm.js';
    import { ESTRATEGIAS } from '../assets/js/engine/strategies/index.js';
    import { calcularCanal } from '../assets/js/engine/strategies/canal.js';
    import { paramsDoPerfil } from '../assets/js/engine/params.js';
    import { avaliarMoeda, reiniciarMotor, aplicarPerfil } from '../assets/js/engine/engine.js';
    import { verificarApuracao } from '../assets/js/engine/apuracao.js';
    import { noEscopo, criarSilencio, variacaoNaJanela, cruzou, regrasPadrao, alertasIniciais } from '../assets/js/alerts/rules.js';
    import { visivelPara, contarNaoLidos } from '../assets/js/alerts/center.js';

    const grupos = [];
    let atual = null;
    function grupo(nome) { atual = { nome, casos: [] }; grupos.push(atual); }
    const abertaOculta = document.hidden; // aba em segundo plano: o navegador segura os timers
    const assincronos = [];
    function registrar(caso, r) {
      caso.ok = r === true || r === undefined || (r && r.ok);
      caso.det = r && r.det;
    }
    function teste(nome, fn) {
      const caso = { nome, ok: false, det: null };
      atual.casos.push(caso);
      try {
        const r = fn();
        if (r && typeof r.then === 'function') {
          assincronos.push(r.then((v) => registrar(caso, v), (e) => { caso.det = e.message; }));
        } else registrar(caso, r);
      } catch (e) {
        caso.det = e.message;
      }
    }
    const dormir = (ms) => new Promise((r) => setTimeout(r, ms));
    const igual = (a, b, eps = 0.005) => Math.abs(a - b) <= eps;
    const espera = (obtido, esperado) => ({ ok: JSON.stringify(obtido) === JSON.stringify(esperado), det: `obtido ${JSON.stringify(obtido)} · esperado ${JSON.stringify(esperado)}` });

    // ---------------------------------------------------------------
    grupo('PRNG com semente');
    teste('mesma semente → mesma sequência', () => {
      const a = criarRandom(20261024), b = criarRandom(20261024);
      return Array.from({ length: 50 }, () => a.proximo()).every((v) => v === b.proximo());
    });
    teste('entre(), inteiro() e escolher() respeitam os limites', () => {
      const r = criarRandom(1);
      for (let i = 0; i < 2000; i++) {
        const x = r.entre(2, 5), n = r.inteiro(1, 3), e = r.escolher(['a', 'b']);
        if (x < 2 || x >= 5 || n < 1 || n > 3 || !['a', 'b'].includes(e)) return false;
      }
      return true;
    });
    teste('normal() tem média ~0 e desvio ~1', () => {
      const r = criarRandom(7); const xs = Array.from({ length: 20000 }, () => r.normal());
      const m = xs.reduce((s, x) => s + x, 0) / xs.length;
      const d = Math.sqrt(xs.reduce((s, x) => s + (x - m) ** 2, 0) / xs.length);
      return { ok: Math.abs(m) < 0.03 && Math.abs(d - 1) < 0.03, det: `média ${m.toFixed(4)} · desvio ${d.toFixed(4)}` };
    });

    // ---------------------------------------------------------------
    grupo('Períodos de apuração (dia 10, 20 e 30)');
    const casos = [
      // [data, dia, início esperado, fim esperado]
      ['2026-02-05', 10, '2026-01-11', '2026-02-10'],
      ['2026-02-15', 10, '2026-02-11', '2026-03-10'],
      ['2026-02-20', 20, '2026-01-21', '2026-02-20'],
      ['2026-02-21', 20, '2026-02-21', '2026-03-20'],
      ['2026-02-15', 30, '2026-01-31', '2026-02-28'],
      ['2026-02-28', 30, '2026-01-31', '2026-02-28'],
      ['2026-03-01', 30, '2026-03-01', '2026-03-30'],
      ['2026-01-31', 30, '2026-01-31', '2026-02-28'],
      ['2028-02-15', 30, '2028-01-31', '2028-02-29'],
      ['2028-02-29', 30, '2028-01-31', '2028-02-29'],
      ['2028-03-01', 30, '2028-03-01', '2028-03-30'],
      ['2028-02-29', 20, '2028-02-21', '2028-03-20'],
      ['2028-02-10', 10, '2028-01-11', '2028-02-10'],
      ['2026-12-31', 30, '2026-12-31', '2027-01-30'],
      ['2026-12-25', 20, '2026-12-21', '2027-01-20'],
    ];
    for (const [d, dia, ini, fim] of casos) {
      teste(`${d} · fecha dia ${dia} → ${ini} a ${fim}`, () => espera(periodoDaData(d, dia), { inicio: ini, fim }));
    }
    teste('primeiro período começa no início do contrato', () => espera(periodoDaData('2026-02-12', 20, '2026-02-08'), { inicio: '2026-02-08', fim: '2026-02-20' }));
    teste('fevereiro/2026 com dia 30: períodos contínuos de jan a abr', () => {
      const lista = datasDosPeriodos({ inicioContrato: '2026-01-05', diaFechamento: 30, ate: '2026-04-15' }).map((p) => `${p.inicio}..${p.fim}`);
      return espera(lista, ['2026-01-05..2026-01-30', '2026-01-31..2026-02-28', '2026-03-01..2026-03-30', '2026-03-31..2026-04-30']);
    });
    teste('fevereiro/2028 (bissexto) com dia 30', () => {
      const lista = datasDosPeriodos({ inicioContrato: '2028-01-31', diaFechamento: 30, ate: '2028-03-02' }).map((p) => `${p.inicio}..${p.fim}`);
      return espera(lista, ['2028-01-31..2028-02-29', '2028-03-01..2028-03-30']);
    });
    teste('troca do dia de fechamento vale a partir do período seguinte', () => {
      const lista = datasDosPeriodos({ inicioContrato: '2026-01-11', diaFechamento: 10, ate: '2026-03-15', trocas: [{ aPartirDe: '2026-02-11', dia: 20 }] }).map((p) => `${p.inicio}..${p.fim}`);
      return espera(lista, ['2026-01-11..2026-02-10', '2026-02-11..2026-02-20', '2026-02-21..2026-03-20']);
    });
    teste('comissão = max(resultado, 0) × %', () => calcularComissao(1234.567, 25) === 308.64 && calcularComissao(-50, 25) === 0);

    // ---------------------------------------------------------------
    grupo('Histórico gerado (preços simulados, data fixa)');
    const agora = new Date(2026, 9, 24, 15, 30);
    const hist = historicoSimulado(MOEDAS_ATIVAS, agora);
    const t0 = performance.now();
    const dados = gerarDados({ historico: hist, agora });
    const ms = performance.now() - t0;
    const v = validarDados(dados);
    const st = dados.estatisticas;

    teste(`gera em menos de 300 ms (${ms.toFixed(0)} ms)`, () => ms < 300);
    teste(`volume de operações (${st.executadas} executadas, ${st.programadas} programadas)`, () => st.executadas >= 1500 && st.programadas > 0);
    teste('validações do gerador sem problemas', () => ({ ok: v.ok, det: v.problemas.slice(0, 5).join(' · ') }));
    teste('nenhum saldo livre negativo em toda a linha do tempo', () => {
      const piores = Object.entries(v.minimos).map(([id, m]) => `${id}: ${m.saldo.toFixed(2)}`);
      return { ok: Object.values(v.minimos).every((m) => m.saldo >= -0.01), det: piores.join(' · ') };
    });
    teste('nenhuma compra acima do disponível para operar', () => Object.values(v.minimos).every((m) => m.disponivel >= -0.01));
    teste('mesmos dados ao gerar de novo (mesmo dia, mesma semente)', () => {
      const de2 = gerarDados({ historico: hist, agora });
      const soma = (d) => relatorio(d.ordens).resultado;
      return { ok: JSON.stringify(de2.ordens) === JSON.stringify(dados.ordens) && soma(de2) === soma(dados), det: `resultado total ${soma(dados).toFixed(2)}` };
    });

    for (const c of Object.values(dados.clientes)) {
      const b = resumoBanca(c, dados.ordens, dados.movimentos, dados.precos);
      const pos = posicoesAbertas(dados.ordens, { clienteId: c.id }).length;
      const prog = dados.ordens.filter((o) => o.clienteId === c.id && o.status === 'programada').length;
      const aberto = dados.periodos.some((p) => p.clienteId === c.id && p.status === 'aberto');
      if (c.status === 'ativo') {
        teste(`${c.id} ${c.nome}: posições (${pos}), ordens programadas (${prog}) e período aberto`, () => pos > 0 && prog > 0 && aberto);
      }
      teste(`${c.id}: saldo livre ${b.saldoLivre.toFixed(2)} ≥ 0 e caixa = saldo + custo das posições`, () => b.saldoLivre >= -0.01 && igual(b.caixa, b.saldoLivre + b.custoPosicoes));
    }
    teste('cliente do cenário "comissão vencida" tem período vencido e compras travadas', () => {
      const c = Object.values(dados.clientes).find((x) => x.cenario === 'comissao-vencida');
      return dados.periodos.some((p) => p.clienteId === c.id && p.status === 'vencido') && c.travaPorComissao;
    });

    // ---------------------------------------------------------------
    grupo('Relatório de resultados');
    for (const id of ['c01', 'c04', null]) {
      const rel = relatorio(dados.ordens, { clienteId: id });
      teste(`${id ?? 'todos'}: soma do relatório = soma das linhas`, () => {
        const linhas = rel.linhas.reduce((s, l) => s + l.liquido, 0);
        return { ok: igual(rel.resultado, linhas) && igual(rel.lucroBruto - rel.taxas, rel.resultado), det: `${rel.resultado.toFixed(2)} vs ${linhas.toFixed(2)} (${rel.linhas.length} linhas)` };
      });
      teste(`${id ?? 'todos'}: soma por moeda e por dia = total`, () => {
        const m = Object.values(rel.porMoeda).reduce((s, x) => s + x.resultado, 0);
        const d = rel.porDia.reduce((s, x) => s + x.resultado, 0);
        return { ok: igual(m, rel.resultado) && igual(d, rel.resultado), det: `moedas ${m.toFixed(2)} · dias ${d.toFixed(2)} · total ${rel.resultado.toFixed(2)}` };
      });
    }
    teste('filtro por moedas soma as partes', () => {
      const todas = relatorio(dados.ordens, { clienteId: 'c04' });
      const partes = Object.keys(todas.porMoeda).map((m) => relatorio(dados.ordens, { clienteId: 'c04', moedas: [m] }).resultado);
      return igual(partes.reduce((s, x) => s + x, 0), todas.resultado);
    });

    // ---------------------------------------------------------------
    grupo('Comissão de um período apurado (cálculo manual)');
    const amostra = dados.periodos.filter((p) => p.status !== 'aberto' && p.comissao > 0).slice(0, 3);
    for (const p of amostra) {
      teste(`${p.clienteId} ${p.inicio} a ${p.fim}: ${p.comissao.toFixed(2)} USDT`, () => {
        // Refaz à mão, sem usar calc/: cada venda do período menos o custo e as taxas da compra.
        const porId = new Map(dados.ordens.map((o) => [o.id, o]));
        let resultado = 0;
        for (const o of dados.ordens) {
          if (o.clienteId !== p.clienteId || o.lado !== 'venda' || o.status !== 'executada') continue;
          const dia = diaISO(o.executadaEm);
          if (dia < p.inicio || dia > p.fim) continue;
          const c = porId.get(o.compraId);
          const f = o.quantidade / c.quantidade;
          resultado += o.total - c.total * f - o.taxa - c.taxa * f;
        }
        const manual = Math.round(Math.max(resultado, 0) * p.comissaoPct) / 100;
        return { ok: igual(manual, p.comissao, 0.011), det: `manual ${manual.toFixed(2)} · resultado ${resultado.toFixed(2)} × ${p.comissaoPct}%` };
      });
    }

    // ---------------------------------------------------------------
    grupo('Evolução do patrimônio');
    teste('último ponto da série ≈ patrimônio pelo fechamento do dia', () => {
      const c = dados.clientes.c01;
      const diarios = Object.fromEntries(Object.entries(dados.precos).map(([s, p]) => [s, p.diario]));
      const hoje = diaISO(agora);
      const serie = evolucaoPatrimonio({ clienteId: c.id, ordens: dados.ordens, movimentos: dados.movimentos, diarios, de: c.inicioContrato, ate: hoje });
      const precosDia = Object.fromEntries(Object.entries(dados.precos).map(([s, p]) => [s, { atual: p.diario.at(-1).fechamento }]));
      const b = resumoBanca(c, dados.ordens, dados.movimentos, precosDia);
      return { ok: igual(serie.at(-1).patrimonio, b.patrimonio, 0.05) && serie.every((p) => p.saldoLivre >= -0.01), det: `${serie.at(-1).patrimonio.toFixed(2)} vs ${b.patrimonio.toFixed(2)} (${serie.length} dias)` };
    });

    // ---------------------------------------------------------------
    grupo('Visão do cliente (F3)');
    const ctxF = { hoje: '2026-10-24', inicioContrato: '2026-04-27', periodos: [
      { status: 'aberto', inicio: '2026-10-11', fim: '2026-11-10' },
      { status: 'pago', inicio: '2026-09-11', fim: '2026-10-10' },
    ] };
    teste('presets de período: hoje, 7 e 30 dias, mês, desde o início, período atual e anterior', () => espera(
      ['hoje', '7d', '30d', 'mes', 'inicio', 'periodo', 'anterior'].map((p) => intervaloDoPreset(p, ctxF)),
      [{ de: '2026-10-24', ate: '2026-10-24' }, { de: '2026-10-18', ate: '2026-10-24' }, { de: '2026-09-25', ate: '2026-10-24' },
        { de: '2026-10-01', ate: '2026-10-24' }, { de: '2026-04-27', ate: '2026-10-24' },
        { de: '2026-10-11', ate: '2026-11-10' }, { de: '2026-09-11', ate: '2026-10-10' }]));
    teste('sem período aberto, o preset "período atual" não se aplica', () => intervaloDoPreset('periodo', { ...ctxF, periodos: [ctxF.periodos[1]] }) === null);
    teste('filtros da URL: datas, moedas válidas e lado; preset detectado', () => {
      const f = lerFiltros(new URLSearchParams('de=2026-10-11&ate=2026-11-10&moedas=BTC,XYZ,eth&lado=venda'), { ctx: ctxF, moedas: ['BTC', 'ETH', 'SOL'], comLado: true });
      return espera(f, { preset: 'periodo', de: '2026-10-11', ate: '2026-11-10', moedas: ['BTC', 'ETH'], lado: 'venda' });
    });
    teste('filtros da URL: data inválida usa o padrão; datas invertidas são trocadas; todas as moedas = sem filtro', () => {
      const a = lerFiltros(new URLSearchParams('de=2026-02-30&ate=2026-10-24'), { padrao: '7d', ctx: ctxF, moedas: ['BTC'] });
      const b = lerFiltros(new URLSearchParams('de=2026-10-20&ate=2026-10-01&moedas=BTC,ETH'), { ctx: ctxF, moedas: ['BTC', 'ETH'] });
      return a.preset === '7d' && a.de === '2026-10-18' && b.de === '2026-10-01' && b.ate === '2026-10-20' && b.preset === 'personalizado' && b.moedas.length === 0;
    });
    teste('filtros → URL (#/cliente/relatorio?de=…&ate=…&moedas=BTC,ETH)', () =>
      espera(textoConsulta(consultaDosFiltros({ de: '2026-10-01', ate: '2026-10-24', moedas: ['BTC', 'ETH'], lado: '' })), 'de=2026-10-01&ate=2026-10-24&moedas=BTC,ETH'));
    teste('datas ISO formatadas no dia local (sem voltar um dia pelo fuso)', () => data('2026-10-24') === '24/10/2026' && intervalo('2026-10-11', '2026-11-10') === '11/10/2026 a 10/11/2026');

    teste('CSV para o Excel pt-BR: BOM, separador ;, decimal com vírgula, aspas e CRLF', () => {
      const rel = relatorio(dados.ordens, { clienteId: 'c01' });
      const csv = relatorioCSV(rel, { cabecalho: [['Cliente', 'Nome; "com" aspas']] });
      const linhas = csv.split('\r\n');
      const dadosLinha = linhas[3].split(';');
      const ok = csv.charCodeAt(0) === 0xFEFF && linhas[0] === '﻿Cliente;"Nome; ""com"" aspas"'
        && linhas[2].startsWith('Data da venda;') && /^\d{2}\/\d{2}\/\d{4}$/.test(dadosLinha[0])
        && /^-?\d+,\d{2}$/.test(dadosLinha.at(-1)) && !csv.includes('−') && linhas.at(-2).startsWith('Total;')
        && linhas.length === rel.linhas.length + 5;
      return { ok, det: linhas.slice(0, 4).join(' | ') };
    });
    teste('números do CSV: sem milhar, hífen como sinal, −0 vira 0, quantidade sem zeros à direita', () =>
      numeroCSV(12345.678) === '12345,68' && numeroCSV(-3.5) === '-3,50' && numeroCSV(-0.001) === '0,00'
      && numeroCSV(0.01230000, 8, { enxugar: true }) === '0,0123' && numeroCSV(2, 8, { enxugar: true }) === '2');

    const fechados = dados.periodos.filter((p) => p.status !== 'aberto');
    teste(`C4 no intervalo exato de cada período = resultado do período em C5 (${fechados.length} períodos)`, () => {
      const erros = fechados.filter((p) => {
        const r = relatorio(dados.ordens, { clienteId: p.clienteId, inicio: p.inicio, fim: p.fim }).resultado;
        return Math.abs(Math.round(r * 100) / 100 - p.resultado) > 0.006;
      });
      return { ok: erros.length === 0, det: erros.slice(0, 3).map((p) => `${p.id} ${p.resultado}`).join(' · ') };
    });
    teste('período com prejuízo: comissão 0,00 e já nasce pago', () => {
      const comPrejuizo = fechados.filter((p) => p.resultado < 0);
      const cliente = dados.clientes.c01;
      const simulado = apurar({ ...fechados[0], status: 'aberto', clienteId: 'c01', inicio: '2026-10-01', fim: '2026-10-10' },
        [{ id: 'x1', clienteId: 'c01', moeda: 'BTC', lado: 'compra', status: 'executada', preco: 100, quantidade: 1, total: 100, taxa: 0.1, executadaEm: new Date(2026, 9, 2) },
          { id: 'x2', clienteId: 'c01', moeda: 'BTC', lado: 'venda', status: 'executada', preco: 90, quantidade: 1, total: 90, taxa: 0.09, compraId: 'x1', executadaEm: new Date(2026, 9, 5) }],
        cliente);
      return { ok: comPrejuizo.every((p) => p.comissao === 0 && p.status === 'pago') && simulado.comissao === 0 && simulado.status === 'pago' && simulado.resultado < 0,
        det: `${comPrejuizo.length} períodos com prejuízo no histórico; simulado ${simulado.resultado}` };
    });
    teste('posições em aberto não alteram o resultado do período', () => {
      const p = dados.periodos.find((x) => x.clienteId === 'c01' && x.status === 'aberto');
      const antes = relatorio(dados.ordens, { clienteId: 'c01', inicio: p.inicio, fim: p.fim }).resultado;

      const base = { params: PG, moeda: moedaT, velas: canalVelas, duracaoVela: 15000 };

      const r2 = G.avaliar({ ...base, tipo: 'preco', preco: 99.1, posicoes: [], estado: r1.estado });
      const pos = [{ compra: { id: 'g1', preco: 99.1, quantidade: 1, total: 99.1, estrategia: 'canal', vendaDinamica: true }, venda: null }];
      const r3 = G.avaliar({ ...base, tipo: 'preco', preco: 99.9, posicoes: pos, estado: r1.estado });
      const r4 = G.avaliar({ ...base, tipo: 'vela', preco: 98.7, vela: { t: 999000, fechamento: 98.7 }, posicoes: pos, estado: r1.estado });
      const ok = r1.eventos[0]?.alerta === 'canal-confirmado' && r2.sinais[0]?.tipo === 'compra'
        && r3.sinais.some((x) => x.tipo === 'venda' && x.motivo === 'topo do canal')
        && r4.eventos[0]?.alerta === 'canal-rompido' && r4.sinais.some((x) => x.stop && x.compraId === 'g1') && r4.estado.pausaAte > 999000;
      return { ok, det: JSON.stringify({ e1: r1.eventos, s2: r2.sinais, s3: r3.sinais, e4: r4.eventos, s4: r4.sinais }) };
    });
    teste('opcionais C, D, E e F seguem o mesmo contrato', () => ['escalonada', 'grade', 'dca', 'medias'].every((id) => {
      const e = ESTRATEGIAS[id];
      const r = e.avaliar({ tipo: 'preco', preco: 100, agora: 0, estado: e.estadoInicial(), params: P, moeda: moedaT, posicoes: [], ordensProgramadas: [], velas: [], valorOrdem: 100, podeComprar: () => ({ ok: true }) });
      return e.parametros.length > 0 && Array.isArray(r.sinais) && Array.isArray(r.acoes) && !!r.estado && !!e.aposCompra({ compra: { preco: 100 }, params: P, moeda: moedaT });
    }));

    // Motor de verdade sobre os dados gerados (sem o feed: as cotações são passadas à mão).
    function prepararMotor(perfil = 'demo') {
      const d = gerarDados({ historico: hist, agora: new Date(Date.now() - 3600_000), config: { perfil } });
      d.regrasAlerta = regrasPadrao();
      d.alertas = [];
      carregarDados(d);
      loja.setState({ robo: 'ligado' });
      reiniciarMotor();
      return getState();
    }
    function passeio(s, segundos, { passo = 0.004, semente = 5, inicio = Date.now() + 1000 } = {}) {
      const rnd = criarRandom(semente);
      for (let i = 0; i < segundos; i++) {
        for (const m of Object.keys(s.precos)) {
          const p = s.precos[m];
          p.anterior = p.atual;
          p.atual *= Math.exp((rnd.proximo() - 0.5) * passo);
          avaliarMoeda(m, { preco: p.atual, agora: inicio + i * 1000 });
        }
      }
    }
    const aoVivo = (s) => s.ordens.filter((o) => o.origem === 'ao-vivo');
    teste('motor (perfil Demonstração, 5 min simulados): surgem compras e vendas e toda venda aponta para uma compra', () => {
      const s = prepararMotor();
      const eventos = [];
      const fora = loja.on('engine:event', (e) => eventos.push(e.alerta));
      passeio(s, 300);
      fora();
      const exec = aoVivo(s).filter((o) => o.status === 'executada');
      const vendas = exec.filter((o) => o.lado === 'venda');
      const semCompra = vendas.filter((v) => { const c = loja.ordemPorId(v.compraId); return !c || c.status !== 'executada' || c.lado !== 'compra'; });
      const val = validarDados(s);
      return { ok: exec.some((o) => o.lado === 'compra') && vendas.length > 0 && !semCompra.length && val.ok,
        det: `${exec.length} executadas (${vendas.length} vendas) · eventos ${[...new Set(eventos)].join(',')} · ${val.problemas.slice(0, 3).join(' · ')}` };
    });
    teste('nenhuma venda automática abaixo do lucro mínimo (exceto stop, identificado no motivo)', () => {
      const s = getState();
      const ruins = aoVivo(s).filter((o) => o.lado === 'venda' && o.status === 'executada').filter((v) => {
        const c = loja.ordemPorId(v.compraId);
        const lm = s.moedas[v.moeda].params.lucroMinimo;
        return v.preco < c.preco * (1 + lm / 100) - 1e-9 && !/stop/.test(v.motivo);
      });
      return { ok: !ruins.length, det: ruins.slice(0, 3).map((o) => `${o.id} ${o.motivo}`).join(' · ') };
    });
    teste('nenhuma compra ao vivo viola a reserva de banca; sem disponível sai o evento "reserva"', () => {
      const s = prepararMotor();
      for (const c of Object.values(s.clientes)) c.reservaPct = 95;
      const eventos = [];
      const fora = loja.on('engine:event', (e) => eventos.push(e));
      passeio(s, 120);
      fora();
      const compras = aoVivo(s).filter((o) => o.lado === 'compra');
      return { ok: compras.length === 0 && eventos.some((e) => e.alerta === 'reserva-banca'), det: `${compras.length} compras` };
    });
    teste('robô pausado: nenhuma ordem nova nem execução', () => {
      const s = prepararMotor();
      const antes = s.ordens.length;
      const executadas = s.ordens.filter((o) => o.status === 'executada').length;
      loja.setState({ robo: 'pausado' });
      passeio(s, 120);
      const ok = s.ordens.length === antes && s.ordens.filter((o) => o.status === 'executada').length === executadas;
      loja.setState({ robo: 'ligado' });
      return { ok, det: `${s.ordens.length - antes} ordens novas` };
    });
    teste('com confirmação de 2 velas, um pico de 1 vela não gera compra (motor, estratégia A)', () => {
      const s = prepararMotor();
      const m = 'ETH';
      s.moedas[m].confirmacao = { ...s.moedas[m].confirmacao, ativa: true, modo: 'velas', n: 2 };
      const quem = Object.values(s.clientes).filter((c) => c.status === 'ativo' && c.moedas.includes(m) && !c.travaPorComissao).map((c) => c.id);
      const contar = () => aoVivo(s).filter((o) => o.moeda === m && o.lado === 'compra' && o.tipo === 'MARKET').length;
      const p0 = s.precos[m].atual;
      let t = Date.now() + 1000;
      const vela = (fechamento) => ({ t: (t += 15000), abertura: fechamento, maxima: fechamento, minima: fechamento, fechamento, volume: 1 });
      const em = (preco, v = null) => avaliarMoeda(m, { preco, vela: v, agora: (t += 1000) });
      em(p0); em(p0 * 0.995); em(p0 * 0.99, vela(p0 * 0.99));           // cai 1%: arma
      em(p0 * 0.996);                                                       // retoma 0,6%: sinal pendente
      const pend = s.estadoMotor[`${quem[0]}:${m}`]?.rotulo ?? '';
      em(p0 * 0.99, vela(p0 * 0.99));                                       // a vela fecha de volta: cancela
      const depoisDoPico = contar();
      em(p0 * 0.996, vela(p0 * 0.996)); em(p0 * 0.997, vela(p0 * 0.997));   // 2 fechamentos seguidos: compra
      const depois = contar();
      return { ok: /aguardando confirmação/i.test(pend) && depoisDoPico === 0 && depois > 0, det: `"${pend}" · após o pico ${depoisDoPico} · após 2 velas ${depois} (${quem.length} clientes)` };
    });
    teste('aplicar o perfil Padrão a uma moeda muda só ela e não mexe nas ordens executadas', () => {
      const s = prepararMotor();
      const executadas = JSON.stringify(s.ordens.filter((o) => o.status === 'executada'));
      aplicarPerfil('padrao', 'BTC');
      return s.moedas.BTC.params.spread === 2 && s.moedas.ETH.params.spread === 0.1 && s.moedas.BTC.confirmacao.intervaloSeg === 60
        && JSON.stringify(s.ordens.filter((o) => o.status === 'executada')) === executadas;
    });

    teste('alertas: escopo, silêncio, variação na janela e cruzamento de preço alvo', () => {
      const r = { escopo: { moedas: ['BTC'], clientes: 'todos' } };
      const sil = criarSilencio();
      const v = variacaoNaJanela([{ p: 100 }, { p: 104 }, { p: 102 }], 100.5);
      return noEscopo(r, { moeda: 'BTC' }) && !noEscopo(r, { moeda: 'ETH' })
        && sil.pode('k', 10, 0) && !sil.pode('k', 10, 5 * 60_000) && sil.pode('k', 10, 11 * 60_000)
        && v.direcao === 'queda' && igual(v.pct, (1 - 100.5 / 104) * 100, 1e-9)
        && cruzou(99, 101, 100) === 'subindo' && cruzou(101, 100, 100) === 'descendo' && cruzou(101, 102, 100) === null;
    });
    teste('central: o cliente só vê os próprios alertas marcados como visíveis para ele', () => {
      const a = { paraAdmin: true, paraCliente: true, clienteId: 'c01', severidade: 'critico', lido: false, lidoCliente: false };
      const b = { paraAdmin: true, paraCliente: false, clienteId: 'c01', severidade: 'info', lido: false };
      const c = { paraAdmin: false, paraCliente: true, clienteId: 'c02', severidade: 'info', lidoCliente: false };
      const s = { alertas: [a, b, c], clienteAtual: 'c01', visao: 'cliente' };
      return visivelPara(a, 'cliente', 'c01') && !visivelPara(b, 'cliente', 'c01') && !visivelPara(c, 'cliente', 'c01') && !visivelPara(c, 'admin', 'c01')
        && JSON.stringify(contarNaoLidos(s, 'cliente')) === '{"total":1,"criticos":1}' && contarNaoLidos(s, 'admin').total === 2;
    });
    teste('alertas iniciais: dos últimos 2 dias, lidos (menos os críticos), com a comissão vencida', () => {
      const d = gerarDados({ historico: hist, agora });
      const lista = alertasIniciais({ ...d, regras: regrasPadrao() });
      const limite = +agora - 48 * 3600_000 - 60_000;
      return { ok: lista.length >= 5 && lista.every((x) => +x.data >= limite && (x.lido || x.severidade === 'critico'))
        && lista.some((x) => x.tipo === 'comissao-vencida' && !x.lido), det: `${lista.length} alertas` };
    });

    teste('apuração automática: virou o dia de fechamento → apura, abre o próximo e emite o fechamento', () => {
      prepararMotor();
      const p = periodoAberto('c01');
      const dia = new Date(`${p.fim}T00:00:00`); dia.setDate(dia.getDate() + 1); dia.setHours(0, 1);
      const fechados = [];
      const fora = loja.on('commission:closed', (x) => fechados.push(x));
      verificarApuracao(dia);
      fora();
      const novo = periodoAberto('c01');
      return { ok: p.status !== 'aberto' && !!novo && novo.inicio > p.fim && fechados.some((x) => x.id === p.id), det: `${p.status} · novo ${novo?.inicio}–${novo?.fim}` };
    });
    teste('vencimento sem pagamento trava as compras; marcar como pago destrava e registra no log', () => {
      const s = getState();
      const p = s.periodos.find((x) => x.status === 'apurado' && x.comissao > 0 && !s.clientes[x.clienteId].travaPorComissao);
      if (!p) return { ok: false, det: 'nenhum período apurado com comissão para testar' };
      const c = s.clientes[p.clienteId];
      const depois = new Date(`${p.vencimento}T12:00:00`); depois.setDate(depois.getDate() + 1);
      verificarApuracao(depois);
      const travado = p.status === 'vencido' && c.travaPorComissao;
      for (const x of s.periodos) if (x.clienteId === c.id && x.status === 'vencido') loja.marcarPago(x.id, depois);
      const liberado = !c.travaPorComissao && s.logAdmin.some((l) => l.texto === `Comissão de ${c.nome} paga: compras liberadas`);
      return { ok: travado && liberado, det: `${p.id} ${p.status} · trava ${c.travaPorComissao}` };
    });

    await Promise.all(assincronos);

    // ---------------------------------------------------------------
    const saida = document.getElementById('saida');
    let total = 0, falhas = 0;
    saida.innerHTML = grupos.map((g) => `
      <section class="grupo">
        <h2>${g.nome}</h2>
        <ul>${g.casos.map((c) => {
          total++; if (!c.ok) falhas++;
          return `<li class="${c.ok ? 'ok' : 'falha'}"><span>${c.nome}</span>${c.det && !c.ok ? `<span class="det">${c.det}</span>` : ''}</li>`;
        }).join('')}</ul>
      </section>`).join('');
    document.getElementById('resumo').innerHTML = falhas
      ? `<b>${falhas} de ${total}</b> testes falharam.` + (abertaOculta ? ' A página abriu com a aba em segundo plano, o que atrasa os timers dos testes de conexão: recarregue com a aba visível.' : '')
      : `<b>${total} testes</b> passaram. Histórico de ${st.executadas} operações gerado em ${ms.toFixed(0)} ms.`;
    document.title = `${falhas ? '✗' : '✓'} Testes · CriptoOps`;
    window.resultadoTestes = { total, falhas, grupos };
  </script>
</body>
