<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Testes · CriptoOps</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    body { padding: 24px 16px 48px; }
    main { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }
    h1 { font-size: var(--fs-h1); line-height: var(--lh-h1); }
    .resumo { color: var(--text-muted); }
    .resumo b { color: var(--text); }
    .grupo { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; }
    .grupo h2 { font-size: var(--fs-h2); line-height: var(--lh-h2); margin-bottom: 8px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
    li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; }
    .ok::before { content: "✓"; color: var(--up); }
    .falha::before { content: "✗"; color: var(--down); }
    .det { color: var(--text-muted); font-family: var(--font-mono); font-size: 12px; grid-column: 2; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Testes do CriptoOps</h1>
      <p class="resumo" id="resumo">Rodando…</p>
    </header>
    <div id="saida"></div>
  </main>

  <script type="module">
    import { MOEDAS_ATIVAS } from '../assets/js/data/coins.js';
    import { historicoSimulado } from '../assets/js/market/history.js';
    import { gerarDados } from '../assets/js/data/seed.js';
    import { validarDados } from '../assets/js/data/validate.js';
    import { relatorio } from '../assets/js/calc/reports.js';
    import { resumoBanca } from '../assets/js/calc/bank.js';
    import { posicoesAbertas } from '../assets/js/calc/positions.js';
    import { periodoDaData, fimDoPeriodo, datasDosPeriodos, calcularComissao } from '../assets/js/calc/commission.js';
    import { evolucaoPatrimonio } from '../assets/js/calc/equity.js';
    import { criarRandom } from '../assets/js/utils/random.js';
    import { diaISO } from '../assets/js/utils/dates.js';

    const grupos = [];
    let atual = null;
    function grupo(nome) { atual = { nome, casos: [] }; grupos.push(atual); }
    function teste(nome, fn) {
      try {
        const r = fn();
        const ok = r === true || r === undefined || (r && r.ok);
        atual.casos.push({ nome, ok, det: r && r.det });
      } catch (e) {
        atual.casos.push({ nome, ok: false, det: e.message });
      }
    }
    const igual = (a, b, eps = 0.005) => Math.abs(a - b) <= eps;
    const espera = (obtido, esperado) => ({ ok: JSON.stringify(obtido) === JSON.stringify(esperado), det: `obtido ${JSON.stringify(obtido)} · esperado ${JSON.stringify(esperado)}` });

    // ---------------------------------------------------------------
    grupo('PRNG com semente');
    teste('mesma semente → mesma sequência', () => {
      const a = criarRandom(20261024), b = criarRandom(20261024);
      return Array.from({ length: 50 }, () => a.proximo()).every((v) => v === b.proximo());
    });
    teste('entre(), inteiro() e escolher() respeitam os limites', () => {
      const r = criarRandom(1);
      for (let i = 0; i < 2000; i++) {
        const x = r.entre(2, 5), n = r.inteiro(1, 3), e = r.escolher(['a', 'b']);
        if (x < 2 || x >= 5 || n < 1 || n > 3 || !['a', 'b'].includes(e)) return false;
      }
      return true;
    });
    teste('normal() tem média ~0 e desvio ~1', () => {
      const r = criarRandom(7); const xs = Array.from({ length: 20000 }, () => r.normal());
      const m = xs.reduce((s, x) => s + x, 0) / xs.length;
      const d = Math.sqrt(xs.reduce((s, x) => s + (x - m) ** 2, 0) / xs.length);
      return { ok: Math.abs(m) < 0.03 && Math.abs(d - 1) < 0.03, det: `média ${m.toFixed(4)} · desvio ${d.toFixed(4)}` };
    });

    // ---------------------------------------------------------------
    grupo('Períodos de apuração (dia 10, 20 e 30)');
    const casos = [
      // [data, dia, início esperado, fim esperado]
      ['2026-02-05', 10, '2026-01-11', '2026-02-10'],
      ['2026-02-15', 10, '2026-02-11', '2026-03-10'],
      ['2026-02-20', 20, '2026-01-21', '2026-02-20'],
      ['2026-02-21', 20, '2026-02-21', '2026-03-20'],
      ['2026-02-15', 30, '2026-01-31', '2026-02-28'],
      ['2026-02-28', 30, '2026-01-31', '2026-02-28'],
      ['2026-03-01', 30, '2026-03-01', '2026-03-30'],
      ['2026-01-31', 30, '2026-01-31', '2026-02-28'],
      ['2028-02-15', 30, '2028-01-31', '2028-02-29'],
      ['2028-02-29', 30, '2028-01-31', '2028-02-29'],
      ['2028-03-01', 30, '2028-03-01', '2028-03-30'],
      ['2028-02-29', 20, '2028-02-21', '2028-03-20'],
      ['2028-02-10', 10, '2028-01-11', '2028-02-10'],
      ['2026-12-31', 30, '2026-12-31', '2027-01-30'],
      ['2026-12-25', 20, '2026-12-21', '2027-01-20'],
    ];
    for (const [d, dia, ini, fim] of casos) {
      teste(`${d} · fecha dia ${dia} → ${ini} a ${fim}`, () => espera(periodoDaData(d, dia), { inicio: ini, fim }));
    }
    teste('primeiro período começa no início do contrato', () => espera(periodoDaData('2026-02-12', 20, '2026-02-08'), { inicio: '2026-02-08', fim: '2026-02-20' }));
    teste('fevereiro/2026 com dia 30: períodos contínuos de jan a abr', () => {
      const lista = datasDosPeriodos({ inicioContrato: '2026-01-05', diaFechamento: 30, ate: '2026-04-15' }).map((p) => `${p.inicio}..${p.fim}`);
      return espera(lista, ['2026-01-05..2026-01-30', '2026-01-31..2026-02-28', '2026-03-01..2026-03-30', '2026-03-31..2026-04-30']);
    });
    teste('fevereiro/2028 (bissexto) com dia 30', () => {
      const lista = datasDosPeriodos({ inicioContrato: '2028-01-31', diaFechamento: 30, ate: '2028-03-02' }).map((p) => `${p.inicio}..${p.fim}`);
      return espera(lista, ['2028-01-31..2028-02-29', '2028-03-01..2028-03-30']);
    });
    teste('troca do dia de fechamento vale a partir do período seguinte', () => {
      const lista = datasDosPeriodos({ inicioContrato: '2026-01-11', diaFechamento: 10, ate: '2026-03-15', trocas: [{ aPartirDe: '2026-02-11', dia: 20 }] }).map((p) => `${p.inicio}..${p.fim}`);
      return espera(lista, ['2026-01-11..2026-02-10', '2026-02-11..2026-02-20', '2026-02-21..2026-03-20']);
    });
    teste('comissão = max(resultado, 0) × %', () => calcularComissao(1234.567, 25) === 308.64 && calcularComissao(-50, 25) === 0);

    // ---------------------------------------------------------------
    grupo('Histórico gerado (preços simulados, data fixa)');
    const agora = new Date(2026, 9, 24, 15, 30);
    const hist = historicoSimulado(MOEDAS_ATIVAS, agora);
    const t0 = performance.now();
    const dados = gerarDados({ historico: hist, agora });
    const ms = performance.now() - t0;
    const v = validarDados(dados);
    const st = dados.estatisticas;

    teste(`gera em menos de 300 ms (${ms.toFixed(0)} ms)`, () => ms < 300);
    teste(`volume de operações (${st.executadas} executadas, ${st.programadas} programadas)`, () => st.executadas >= 1500 && st.programadas > 0);
    teste('validações do gerador sem problemas', () => ({ ok: v.ok, det: v.problemas.slice(0, 5).join(' · ') }));
    teste('nenhum saldo livre negativo em toda a linha do tempo', () => {
      const piores = Object.entries(v.minimos).map(([id, m]) => `${id}: ${m.saldo.toFixed(2)}`);
      return { ok: Object.values(v.minimos).every((m) => m.saldo >= -0.01), det: piores.join(' · ') };
    });
    teste('nenhuma compra acima do disponível para operar', () => Object.values(v.minimos).every((m) => m.disponivel >= -0.01));
    teste('mesmos dados ao gerar de novo (mesmo dia, mesma semente)', () => {
      const de2 = gerarDados({ historico: hist, agora });
      const soma = (d) => relatorio(d.ordens).resultado;
      return { ok: JSON.stringify(de2.ordens) === JSON.stringify(dados.ordens) && soma(de2) === soma(dados), det: `resultado total ${soma(dados).toFixed(2)}` };
    });

    for (const c of Object.values(dados.clientes)) {
      const b = resumoBanca(c, dados.ordens, dados.movimentos, dados.precos);
      const pos = posicoesAbertas(dados.ordens, { clienteId: c.id }).length;
      const prog = dados.ordens.filter((o) => o.clienteId === c.id && o.status === 'programada').length;
      const aberto = dados.periodos.some((p) => p.clienteId === c.id && p.status === 'aberto');
      if (c.status === 'ativo') {
        teste(`${c.id} ${c.nome}: posições (${pos}), ordens programadas (${prog}) e período aberto`, () => pos > 0 && prog > 0 && aberto);
      }
      teste(`${c.id}: saldo livre ${b.saldoLivre.toFixed(2)} ≥ 0 e caixa = saldo + custo das posições`, () => b.saldoLivre >= -0.01 && igual(b.caixa, b.saldoLivre + b.custoPosicoes));
    }
    teste('cliente do cenário "comissão vencida" tem período vencido e compras travadas', () => {
      const c = Object.values(dados.clientes).find((x) => x.cenario === 'comissao-vencida');
      return dados.periodos.some((p) => p.clienteId === c.id && p.status === 'vencido') && c.travaPorComissao;
    });

    // ---------------------------------------------------------------
    grupo('Relatório de resultados');
    for (const id of ['c01', 'c04', null]) {
      const rel = relatorio(dados.ordens, { clienteId: id });
      teste(`${id ?? 'todos'}: soma do relatório = soma das linhas`, () => {
        const linhas = rel.linhas.reduce((s, l) => s + l.liquido, 0);
        return { ok: igual(rel.resultado, linhas) && igual(rel.lucroBruto - rel.taxas, rel.resultado), det: `${rel.resultado.toFixed(2)} vs ${linhas.toFixed(2)} (${rel.linhas.length} linhas)` };
      });
      teste(`${id ?? 'todos'}: soma por moeda e por dia = total`, () => {
        const m = Object.values(rel.porMoeda).reduce((s, x) => s + x.resultado, 0);
        const d = rel.porDia.reduce((s, x) => s + x.resultado, 0);
        return { ok: igual(m, rel.resultado) && igual(d, rel.resultado), det: `moedas ${m.toFixed(2)} · dias ${d.toFixed(2)} · total ${rel.resultado.toFixed(2)}` };
      });
    }
    teste('filtro por moedas soma as partes', () => {
      const todas = relatorio(dados.ordens, { clienteId: 'c04' });
      const partes = Object.keys(todas.porMoeda).map((m) => relatorio(dados.ordens, { clienteId: 'c04', moedas: [m] }).resultado);
      return igual(partes.reduce((s, x) => s + x, 0), todas.resultado);
    });

    // ---------------------------------------------------------------
    grupo('Comissão de um período apurado (cálculo manual)');
    const amostra = dados.periodos.filter((p) => p.status !== 'aberto' && p.comissao > 0).slice(0, 3);
    for (const p of amostra) {
      teste(`${p.clienteId} ${p.inicio} a ${p.fim}: ${p.comissao.toFixed(2)} USDT`, () => {
        // Refaz à mão, sem usar calc/: cada venda do período menos o custo e as taxas da compra.
        const porId = new Map(dados.ordens.map((o) => [o.id, o]));
        let resultado = 0;
        for (const o of dados.ordens) {
          if (o.clienteId !== p.clienteId || o.lado !== 'venda' || o.status !== 'executada') continue;
          const dia = diaISO(o.executadaEm);
          if (dia < p.inicio || dia > p.fim) continue;
          const c = porId.get(o.compraId);
          const f = o.quantidade / c.quantidade;
          resultado += o.total - c.total * f - o.taxa - c.taxa * f;
        }
        const manual = Math.round(Math.max(resultado, 0) * p.comissaoPct) / 100;
        return { ok: igual(manual, p.comissao, 0.011), det: `manual ${manual.toFixed(2)} · resultado ${resultado.toFixed(2)} × ${p.comissaoPct}%` };
      });
    }

    // ---------------------------------------------------------------
    grupo('Evolução do patrimônio');
    teste('último ponto da série ≈ patrimônio pelo fechamento do dia', () => {
      const c = dados.clientes.c01;
      const diarios = Object.fromEntries(Object.entries(dados.precos).map(([s, p]) => [s, p.diario]));
      const hoje = diaISO(agora);
      const serie = evolucaoPatrimonio({ clienteId: c.id, ordens: dados.ordens, movimentos: dados.movimentos, diarios, de: c.inicioContrato, ate: hoje });
      const precosDia = Object.fromEntries(Object.entries(dados.precos).map(([s, p]) => [s, { atual: p.diario.at(-1).fechamento }]));
      const b = resumoBanca(c, dados.ordens, dados.movimentos, precosDia);
      return { ok: igual(serie.at(-1).patrimonio, b.patrimonio, 0.05) && serie.every((p) => p.saldoLivre >= -0.01), det: `${serie.at(-1).patrimonio.toFixed(2)} vs ${b.patrimonio.toFixed(2)} (${serie.length} dias)` };
    });

    // ---------------------------------------------------------------
    const saida = document.getElementById('saida');
    let total = 0, falhas = 0;
    saida.innerHTML = grupos.map((g) => `
      <section class="grupo">
        <h2>${g.nome}</h2>
        <ul>${g.casos.map((c) => {
          total++; if (!c.ok) falhas++;
          return `<li class="${c.ok ? 'ok' : 'falha'}"><span>${c.nome}</span>${c.det && !c.ok ? `<span class="det">${c.det}</span>` : ''}</li>`;
        }).join('')}</ul>
      </section>`).join('');
    document.getElementById('resumo').innerHTML = falhas
      ? `<b>${falhas} de ${total}</b> testes falharam.`
      : `<b>${total} testes</b> passaram. Histórico de ${st.executadas} operações gerado em ${ms.toFixed(0)} ms.`;
    document.title = `${falhas ? '✗' : '✓'} Testes · CriptoOps`;
    window.resultadoTestes = { total, falhas, grupos };
  </script>
</body>
</html>
